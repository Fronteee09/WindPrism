<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WindPrism - GitHub Browser</title>
    <style>
        :root {
            --bg-dark-aero: #0b1f15;
            --aero-green: #10b981;
            --aero-green-hover: #059669;
            --aero-green-glow: rgba(16, 185, 129, 0.4);
            --text-light: #e2e8f0;
            --text-muted: #94a3b8;
            --border-aero: rgba(16, 185, 129, 0.3);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }

        body {
            background-color: var(--bg-dark-aero);
            color: var(--text-light);
            height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding: 20px;
            background-image: 
                radial-gradient(circle at 20% 20%, rgba(16, 185, 129, 0.1) 0%, transparent 40%),
                radial-gradient(circle at 80% 80%, rgba(5, 150, 105, 0.08) 0%, transparent 40%);
        }

        .main-container {
            width: 100%;
            max-width: 600px;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 24px;
        }

        .logo {
            font-size: 42px;
            font-weight: 700;
            letter-spacing: 1px;
            color: var(--text-light);
            margin-bottom: 10px;
            text-align: center;
        }

        .logo span {
            color: var(--aero-green);
            text-shadow: 0 0 15px var(--aero-green-glow);
        }

        .search-box-wrapper {
            width: 100%;
            position: relative;
        }

        .search-input {
            width: 100%;
            padding: 16px 24px 16px 52px;
            font-size: 16px;
            color: var(--text-light);
            background: rgba(11, 31, 21, 0.8);
            border: 1px solid var(--border-aero);
            border-radius: 24px;
            outline: none;
            backdrop-filter: blur(12px);
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.3), inset 0 1px 1px rgba(255, 255, 255, 0.1);
            transition: all 0.3s ease;
        }

        .search-input::placeholder {
            color: var(--text-muted);
        }

        .search-input:focus {
            border-color: var(--aero-green);
            box-shadow: 0 0 20px var(--aero-green-glow), inset 0 1px 1px rgba(255, 255, 255, 0.2);
        }

        .search-icon {
            position: absolute;
            left: 20px;
            top: 50%;
            transform: translateY(-50%);
            color: var(--aero-green);
            font-size: 18px;
            pointer-events: none;
        }

        .actions-row {
            display: flex;
            gap: 12px;
        }

        .btn-aero {
            padding: 10px 22px;
            font-size: 14px;
            font-weight: 600;
            color: #ffffff;
            background: linear-gradient(135deg, #10b981 0%, #059669 100%);
            border: 1px solid rgba(255, 255, 255, 0.2);
            border-radius: 12px;
            cursor: pointer;
            box-shadow: 0 4px 15px var(--aero-green-glow), inset 0 1px 1px rgba(255, 255, 255, 0.3);
            backdrop-filter: blur(8px);
            transition: all 0.2s ease;
        }

        .btn-aero:hover {
            background: linear-gradient(135deg, #059669 0%, #047857 100%);
            box-shadow: 0 6px 20px var(--aero-green-glow), inset 0 1px 1px rgba(255, 255, 255, 0.4);
            transform: translateY(-1px);
        }

        .btn-aero:active {
            transform: translateY(1px);
        }
    </style>
</head>
<body>

    <div class="main-container">
        <div class="logo">Wind<span>Prism</span></div>
        
        <div class="search-box-wrapper">
            <span class="search-icon">🔍</span>
            <input type="text" id="searchInput" class="search-input" placeholder="Cerca o digita un URL..." onkeydown="gestisciInvio(event)">
        </div>

        <div class="actions-row">
            <button class="btn-aero" onclick="cercaTutto()">Cerca su GitHub</button>
        </div>
    </div>

    <script>
        function cercaTutto() {
            const query = document.getElementById('searchInput').value.trim();
            if(query) {
                // Esempio: reindirizza direttamente alla ricerca di GitHub o esegue un'azione
                const url = `https://github.com/search?q=${encodeURIComponent(query)}`;
                window.open(url, '_blank');
            } else {
                alert("Inserisci un termine di ricerca.");
            }
        }

        function gestisciInvio(event) {
            if (event.key === 'Enter') {
                cercaTutto();
            }
        }
    </script>
</body>
</html>
